services:
  crm:
    build: .
    restart: unless-stopped
    volumes:
      - crm_data:/data
    env_file: .env
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  crm_data:
  caddy_data:
  caddy_config:
